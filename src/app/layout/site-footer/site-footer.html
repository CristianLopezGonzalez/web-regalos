<footer class="sf">
  <div class="wrap">
    <div class="sf-top">
      <p class="sf-mark" lang="en">My Christmas Wishlist</p>
      @if (session.signedIn()) {
        <button type="button" class="sf-action" (click)="signOut()">Cerrar sesión</button>
      } @else {
        <a routerLink="/login" class="sf-action">Entrar</a>
      }
    </div>
    <div class="sf-notes">
      <p>
        Las reservas son anónimas: nadie ve quién ha reservado cada regalo, y nadie ve qué está
        reservado de su propia lista.
      </p>
      @if (api.isDemo) {
        <p class="sf-credits">Modo demo: datos simulados en este navegador. {{ credits }}</p>
      }
    </div>
  </div>
</footer>
