@if (mode() === 'login') {
  <form class="al-form" novalidate (submit)="signIn($event)">
    <app-auth-field label="Email" forId="login-email" [attempted]="attempted()">
      <input
        id="login-email"
        class="input"
        type="email"
        [formField]="form.email"
        autocomplete="username"
        inputmode="email"
        autocapitalize="none"
        autocorrect="off"
        spellcheck="false"
        enterkeyhint="next"
        (keydown.enter)="nextField($event)"
      />
    </app-auth-field>
    <app-auth-field label="Contraseña" forId="login-password" [attempted]="attempted()">
      <div class="al-reveal-wrap">
        <input
          #pw
          id="login-password"
          class="input"
          [type]="show() ? 'text' : 'password'"
          [formField]="form.password"
          autocomplete="current-password"
          enterkeyhint="go"
        />
        <button
          type="button"
          class="al-reveal"
          (click)="show.set(!show())"
          [attr.aria-pressed]="show()"
        >
          {{ show() ? 'Ocultar' : 'Mostrar' }}<span class="sr-only"> contraseña</span>
        </button>
      </div>
    </app-auth-field>

    <div class="al-live" role="alert">
      @if (failure()) {
        <p class="al-alert">{{ failure() }}</p>
      }
    </div>

    <button
      type="submit"
      class="btn btn-primary w-full"
      [class.is-loading]="busy()"
      [attr.aria-disabled]="busy()"
    >
      {{ busy() ? 'Entrando…' : 'Entrar' }}
    </button>
  </form>
} @else {
  <form class="al-form" novalidate (submit)="sendReset($event)">
    <app-auth-field label="Email" forId="reset-email" [attempted]="resetAttempted()">
      <input
        id="reset-email"
        class="input"
        type="email"
        [formField]="form.email"
        autocomplete="username"
        inputmode="email"
        autocapitalize="none"
        autocorrect="off"
        spellcheck="false"
        enterkeyhint="send"
      />
    </app-auth-field>

    <div class="al-live" role="status">
      @if (sentTo()) {
        <p class="al-note">
          Si hay una cuenta con <strong>{{ sentTo() }}</strong>, el enlace ya va de camino. Mira
          también en el correo no deseado.
        </p>
      }
    </div>
    <div class="al-live" role="alert">
      @if (failure()) {
        <p class="al-alert">{{ failure() }}</p>
      }
    </div>

    <button
      type="submit"
      class="btn btn-primary w-full"
      [class.is-loading]="busy()"
      [class.is-resting]="cooldown() > 0"
      [attr.aria-disabled]="busy() || cooldown() > 0"
    >
      {{ resetLabel() }}
    </button>
  </form>
}
