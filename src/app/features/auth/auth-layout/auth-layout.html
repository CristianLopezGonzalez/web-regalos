<section class="al">
  <!-- The night outside: the Home's arch in gold thread, two stars and slow snow. -->
  <div class="al-bg" aria-hidden="true">
    <svg class="al-arch" viewBox="0 0 400 520">
      <path
        d="M30 520V196a170 170 0 0 1 340 0v324"
        fill="none"
        stroke="#b89a65"
        stroke-width="1"
        opacity=".55"
      />
      <path
        d="M44 520V196a156 156 0 0 1 312 0v324"
        fill="none"
        stroke="#b89a65"
        stroke-width=".6"
        opacity=".3"
      />
      <g fill="#e8cf9c">
        <path
          class="al-tw"
          d="M96 128c.8 7 1.6 8 9 8.8-7.4.8-8.2 1.6-9 8.8-.8-7.2-1.6-8-9-8.8 7.4-.8 8.2-1.8 9-8.8z"
          opacity=".8"
        />
        <path
          class="al-tw al-tw2"
          d="M312 110c.6 5 1 5.6 6 6-5 .5-5.4 1-6 6-.5-5-1-5.5-6-6 5-.4 5.5-1 6-6z"
          opacity=".6"
        />
      </g>
    </svg>
    @for (f of flakes; track $index) {
      <i
        class="al-flake"
        [style.--x.%]="f.x"
        [style.--y.%]="f.y"
        [style.--s.px]="f.s"
        [style.--o]="f.o"
        [style.--d.ms]="f.d"
        [style.--dl.ms]="f.dl"
        [style.--dx.px]="f.dx"
      ></i>
    }
  </div>

  <div
    class="al-env"
    [class.is-open]="opened()"
    [class.is-void]="voided()"
    [class.is-stamped]="stamped()"
  >
    <div class="al-flap" aria-hidden="true">
      <svg viewBox="0 0 100 60" preserveAspectRatio="none">
        <defs>
          <linearGradient id="al-flap-fill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#5a1a28" />
            <stop offset="1" stop-color="#7a2a3b" />
          </linearGradient>
        </defs>
        <path d="M0 0H100L50 60Z" fill="url(#al-flap-fill)" />
        <path
          d="M0 0L50 60L100 0"
          fill="none"
          stroke="#b89a65"
          stroke-width="1"
          vector-effect="non-scaling-stroke"
        />
      </svg>
    </div>

    <!-- The wax seal, drawn twice and clipped along a crack: each half falls its own way. -->
    <div class="al-seal" aria-hidden="true">
      @for (half of ['l', 'r']; track half) {
        <div class="al-seal-half" [class]="'al-seal-half is-' + half">
          <svg viewBox="0 0 60 60">
            <defs>
              <radialGradient [attr.id]="'al-wax-' + half" cx="38%" cy="34%" r="70%">
                <stop offset="0" stop-color="#c2465a" />
                <stop offset=".55" stop-color="#8e2434" />
                <stop offset="1" stop-color="#4f1420" />
              </radialGradient>
            </defs>
            <path
              d="M30 2c5 0 6 3 10 4s7-1 10 3 1 7 3 10 5 5 4 10-4 6-4 10 2 8-2 11-7 1-10 4-5 6-11 6-7-4-11-5-8 1-11-3-1-7-4-10-5-5-4-10 4-6 4-10-2-8 2-11 7-1 10-4 7-3 13-5z"
              [attr.fill]="'url(#al-wax-' + half + ')'"
            />
            <circle
              cx="30"
              cy="31"
              r="17"
              fill="none"
              stroke="#3a0f18"
              stroke-opacity=".35"
              stroke-width="1.6"
            />
            <circle
              cx="30"
              cy="30"
              r="17"
              fill="none"
              stroke="#e8cf9c"
              stroke-opacity=".55"
              stroke-width=".8"
            />
            <text
              x="30"
              y="38"
              text-anchor="middle"
              font-family="Italiana, Didot, serif"
              font-size="22"
              fill="#e8cf9c"
            >
              {{ monogram() }}
            </text>
          </svg>
        </div>
      }
    </div>

    <div class="al-letter">
      <div class="al-views" [class.is-out]="leaving()" [class.is-in]="entering()">
        <header class="al-head">
          @if (eyebrow()) {
            <p class="al-eyebrow">{{ eyebrow() }}</p>
          }
          <h1 class="al-title" tabindex="-1">{{ heading() }}</h1>
          @if (lede()) {
            <p class="al-lede">{{ lede() }}</p>
          }
        </header>
        <div class="al-body"><ng-content /></div>
      </div>
    </div>
  </div>

  <ng-content select="[alAside]" />
</section>
