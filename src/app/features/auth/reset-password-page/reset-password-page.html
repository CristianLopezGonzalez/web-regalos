<app-auth-layout
  eyebrow="Nueva contraseña"
  [heading]="copy().heading"
  [lede]="copy().lede"
  [state]="copy().envelope"
>
  @switch (view()) {
    @case ('checking') {
      <div class="al-body">
        <p class="al-text" role="status">Comprobando el enlace…</p>
        <div class="al-thread" aria-hidden="true"></div>
      </div>
    }
    @case ('form') {
      <form class="al-form al-enter" novalidate (submit)="save($event)">
        <app-auth-field
          label="Contraseña nueva"
          forId="rp-pw"
          hint="Al menos 8 caracteres."
          okText="Vale: 8 caracteres o más."
          [attempted]="attempted()"
          [live]="true"
        >
          <div class="al-reveal-wrap">
            <input
              id="rp-pw"
              class="input"
              [type]="show() ? 'text' : 'password'"
              [formField]="form.password"
              autocomplete="new-password"
              enterkeyhint="done"
            />
            <button
              type="button"
              class="al-reveal"
              (click)="show.set(!show())"
              [attr.aria-pressed]="show()"
            >
              {{ show() ? 'Ocultar' : 'Mostrar' }}<span class="sr-only"> contraseña</span>
            </button>
          </div>
        </app-auth-field>

        <div class="al-live" role="alert">
          @if (error()) {
            <p class="al-alert">{{ error() }}</p>
          }
        </div>

        <button
          type="submit"
          class="btn btn-primary w-full"
          [class.is-loading]="busy()"
          [attr.aria-disabled]="busy()"
        >
          {{ busy() ? 'Guardando…' : 'Guardar contraseña' }}
        </button>
      </form>
    }
    @case ('unreachable') {
      <a class="btn btn-outline w-full al-enter" authLink="/login">Ir a entrar</a>
    }
    @default {
      <div class="al-body al-enter">
        <a class="btn btn-primary w-full" authLink="/login?mode=reset">Pedir otro enlace</a>
        <nav class="al-links" aria-label="Otras opciones">
          <a class="al-link" authLink="/login">Ir a entrar</a>
        </nav>
      </div>
    }
  }
</app-auth-layout>
