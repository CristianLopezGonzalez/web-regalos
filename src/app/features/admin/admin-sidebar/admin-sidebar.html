<nav class="as" aria-label="Trastienda">
  <div class="as-head">
    <p class="as-title">Trastienda</p>
    <p class="as-sub">Solo la ves tú.</p>
  </div>
  <ol role="list">
    @for (i of items(); track i.link) {
      <li>
        <a
          [routerLink]="i.link"
          routerLinkActive="on"
          [routerLinkActiveOptions]="{ exact: i.exact }"
          ariaCurrentWhenActive="page"
        >
          <svg
            class="as-icon"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.3"
            aria-hidden="true"
          >
            @switch (i.icon) {
              @case ('home') {
                <path d="M4 20V10l8-6 8 6v10z" />
              }
              @case ('gift') {
                <rect x="4" y="9" width="16" height="11" />
                <path d="M3 9h18M12 9v11M12 9c-2-4-6-4-6-1s6 1 6 1 6 2 6-1-4-3-6 1" />
              }
              @case ('list') {
                <path d="M4 6h16M4 12h16M4 18h10" />
              }
              @case ('mail') {
                <rect x="3" y="6" width="18" height="12" />
                <path d="m3 7 9 6 9-6" />
              }
              @case ('people') {
                <circle cx="9" cy="9" r="3" />
                <circle cx="17" cy="10" r="2.4" />
                <path d="M3 19c0-3 3-5 6-5s6 2 6 5M15 15c3 0 6 1 6 4" />
              }
            }
          </svg>
          <span>{{ i.label }}</span>
        </a>
      </li>
    }
  </ol>
  <a class="as-back" routerLink="/wishlist"
    >Ver las listas
    <svg width="16" height="10" viewBox="0 0 16 10" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true">
      <path d="M0 5h15M11 1l4 4-4 4" />
    </svg>
  </a>
</nav>
