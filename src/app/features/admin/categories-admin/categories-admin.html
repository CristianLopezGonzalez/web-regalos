<app-admin-page-head
  heading="Categorías"
  lede="Salen en este orden en los filtros de la wishlist. Solo se puede borrar una categoría vacía."
/>

@if (cats(); as list) {
  <form class="ca-new" [formRoot]="newCategory">
    <label class="sr-only" for="cat-new">Nueva categoría</label>
    <input
      id="cat-new"
      class="input"
      [formField]="newCategory.name"
      placeholder="Nueva categoría…"
    />
    <button
      type="submit"
      class="btn btn-primary btn-sm"
      [disabled]="!newCategory.name().value().trim() || busy()"
    >
      Añadir
    </button>
  </form>

  <ol class="ca" role="list">
    @for (c of list; track c.id; let i = $index, first = $first, last = $last) {
      <li class="ca-row">
        <form class="ca-edit" (submit)="$event.preventDefault(); rename(c)">
          <label class="sr-only" [for]="'cat-' + c.id">Nombre de la categoría {{ i + 1 }}</label>
          <input
            class="input"
            [id]="'cat-' + c.id"
            [value]="draft(c)"
            (input)="setDraft(c, $any($event.target).value)"
            [attr.maxlength]="nameMax"
            required
          />
          @if (isRenamed(c)) {
            <button type="submit" class="btn btn-outline btn-sm" [disabled]="!draft(c).trim()">
              Guardar
            </button>
          }
        </form>
        <span class="ca-count tabular"
          >{{ catalogue.countIn(c.id) }}
          <span class="ca-count-word">{{
            catalogue.countIn(c.id) === 1 ? 'regalo' : 'regalos'
          }}</span></span
        >
        <div class="ca-actions">
          <button
            type="button"
            class="ca-icon"
            (click)="move(i, -1)"
            [disabled]="first || busy()"
            [attr.aria-label]="'Subir ' + c.name"
          >
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
              <path d="m6 15 6-6 6 6" />
            </svg>
          </button>
          <button
            type="button"
            class="ca-icon"
            (click)="move(i, 1)"
            [disabled]="last || busy()"
            [attr.aria-label]="'Bajar ' + c.name"
          >
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
              <path d="m6 9 6 6 6-6" />
            </svg>
          </button>
          <button
            type="button"
            class="ca-icon ca-del"
            (click)="remove(c)"
            [disabled]="busy() || catalogue.countIn(c.id) > 0"
            [attr.aria-label]="'Borrar ' + c.name"
            [attr.title]="
              catalogue.countIn(c.id) > 0
                ? 'Mueve sus regalos a otra categoría para poder borrarla'
                : 'Borrar'
            "
          >
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
              <path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" />
            </svg>
          </button>
        </div>
      </li>
    }
  </ol>
} @else {
  <div class="skeleton h-80" aria-hidden="true"></div>
}
